version: "3.8"

# ─────────────────────────────────────────────────────────────
# RideList LOCAL environment
# Run with:
#   docker compose -f local/docker-compose.yml --env-file local/.env up
#
# Build images first:
#   docker build -t ridelist-backend:local ../../ride-listing/
#   docker build --build-arg VITE_API_BASE_URL=http://localhost/api/v1 --build-arg VITE_SITE_URL=http://localhost -t ridelist-frontend:local ../../ridelist-ui/
# ─────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:15-alpine
    container_name: ridelist-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - ridelist-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridelist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${ECR_BACKEND_IMAGE}
    container_name: ridelist-backend-local
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # AWS
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      # Email
      EMAIL_SENDER: ${EMAIL_SENDER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # App
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      IMAGE_MIN_COUNT: ${IMAGE_MIN_COUNT}
      IMAGE_MAX_COUNT: ${IMAGE_MAX_COUNT}
      IMAGE_MAX_SIZE_MB: ${IMAGE_MAX_SIZE_MB}
      # JVM
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom"
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ridelist-local
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    image: ${ECR_FRONTEND_IMAGE}
    container_name: ridelist-frontend-local
    restart: unless-stopped
    networks:
      - ridelist-local

  nginx:
    image: nginx:alpine
    container_name: ridelist-nginx-local
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ridelist-local

volumes:
  postgres_local_data:
    name: ridelist_postgres_local

networks:
  ridelist-local:
    name: ridelist_local_network
    driver: bridge