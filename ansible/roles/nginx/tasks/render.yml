---
# =====================================================
# Render Nginx Configurations (Docker-based reverse proxy)
# =====================================================
- name: Create nginx config directory
  file:
    path: "{{ application_root }}/nginx"
    state: directory
    mode: "0755"

- name: Render nginx main config
  template:
    src: nginx.conf.j2
    dest: "{{ application_root }}/nginx/nginx.conf"
    mode: "0644"

- name: Render frontend routing config
  template:
    src: nginx.frontend.conf.j2
    dest: "{{ application_root }}/nginx/frontend.conf"
    mode: "0644"

- name: Render backend routing config
  template:
    src: nginx.backend.conf.j2
    dest: "{{ application_root }}/nginx/backend.conf"
    mode: "0644"

- name: Render redirect routing config
  template:
    src: nginx.redirect.conf.j2
    dest: "{{ application_root }}/nginx/nginx-redirect.conf"
    mode: "0644"